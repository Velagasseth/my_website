<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth Odero | ML Engineer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg-color: #0f172a;
            --terminal-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #60a5fa;
            --prompt-color: #38bdf8;
            --command-color: #f0f9ff;
            --error-color: #f87171;
            --success-color: #4ade80;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .terminal-container {
            width: 100%;
            max-width: 900px;
            height: 80vh;
        }
        
        .terminal-window {
            background-color: var(--terminal-bg);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
        }
        
        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .close { background-color: #ef4444; }
        .minimize { background-color: #f59e0b; }
        .maximize { background-color: #10b981; }
        
        .window-title {
            flex-grow: 1;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .terminal-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .command-line {
            display: flex;
            margin-bottom: 5px;
        }
        
        .prompt {
            color: var(--prompt-color);
            margin-right: 10px;
            white-space: nowrap;
        }
        
        .user-command {
            color: var(--command-color);
        }
        
        .command-output {
            margin-left: 20px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        #help{
            color:#4ade80;
        }
        
        .success {
            color: var(--success-color);
        }
        
        .error {
            color: var(--error-color);
        }
        
        .input-line {
            display: flex;
            margin-top: 5px;
        }
        
        .input-line input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            caret-color: var(--accent-color);
        }
        
        /* Scrollbar styling */
        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }
        
        .terminal-body::-webkit-scrollbar-track {
            background: var(--terminal-bg);
        }
        
        .terminal-body::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="window-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
                <div class="window-title">seth@portfolio: ~</div>
            </div>
            
            <div class="terminal-body" id="terminal-body">
                <div id="output">
                    <!-- Initial content -->
                    <div class="command-line">
                        <span class="prompt">seth@portfolio:~$</span>
                        <span class="user-command">cd ..</span>
                    </div>
                    <div class="command-output">
                
                        Welcome to Seth's ML terminal portfolio!<br>
                        Type <strong id="help">'help'</strong> to see available commands!
                     
                    </div>
                </div>
                <!-- New input lines will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const terminalBody = document.getElementById('terminal-body');
            const output = document.getElementById('output');
            
            // Command definitions
            const commands = {
                help: {
                    
                    execute: () => printOutput("Available commands:\nabout - About me\nskills - My technical skills\nexperience - my experience\nprojects - My ML projects\ncontact - Contact information\nresume - Download my resume\nclear - Clear terminal")
                },
                about: {
                    
                execute: () => printOutput("Hi!👋 I am Seth Odero - Junior Machine Learning Engineer\n\nPassionate data science student with a strong foundation in statistics, machine learning and data visualization seeking internship or entry level role where I can apply my analytic skills and contribute to solving complex problem using data.\nAm motivated and detail-oriented machine learning student at Kisii University with strong skills in Machine Learning, data manipulation and data visualization. \n\nSeeking an internship or entry-level position to apply my knowledge and skills in a practical environment")
                
            },
                skills: {
                    execute: () => printOutput("Core Technologies:\n\n- Python, Flask\n- Seaborn, Matplotlib\n- Pandas, Numpy, Sckikit-learn, Pytorch\n- Streamlit, Jupyter Notebook\n\nDatabases:\n- MySQL, Sqlite, MicrosoftSQL\n\nOther:\n- CustomTkinter, Kivy")
                },

                experience: {
                    execute: () => printOutput("Experience:\n\nKisii University (2023-Present)\n- Machine Learning Club, Kisii University\n- Organized workshops and hackathons on data science and machine learning.\n- Collaborated with peers on various machine learning projects.\n- Volunteer, Kisii County Community Center\n\nEducation:\n- Kisii University, Kisii County, Kenya Bachelor of Applied Science in Computer Science Expected Graduation: December 2027")
        
                },
                projects: {
                    execute: () => printOutput("⚒️Data/Projects:\n\nDetailed case studies demonstrating my approach to real-world data challenges, showcasing techniques such as regression analysis, clustering, and deep learning using pytorch\n\nUsing Scikit-learn datasets ;\n> Breast_Cancer_Dataset\n>Iris_Datasets\n> Wine_Dataset\n\n👉Link to the project https://myportfolio-iojbai9uggilvkrwjjmvvz.streamlit.app/\n\nUsing Kaggle datasets ;\n\nMade a model from kaggle datasets , gives the estimated salary pay annualy based on Age and Experience\n\n👉Link to the project https://sample2-pkjjtgzhdk7rgokdpek47e.streamlit.app/\n")
                },
                contact: {
                    execute: () => printOutput("Contact Information:\n\n📧Email: velagasseth@gmail.com\n📞Tel. :+254759812041\n💻 GitHub : https://github.com/Velagasseth\n🔗 Linkedin : www.linkedin.com/in/velagasseth-tech\n\nAvailable for:\n- Speaking engagements\n- Entry Level roles\n")
                },
        
        resume: {
            execute: () => {
                printOutput("Initiating resume download...", "success");


                
                try {
                    setTimeout(() => {
            const link = document.createElement('a');
            link.href = "Seth's_Resume  (5).pdf";
            link.download = 'Seth_Odero_Resume.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            printOutput("Resume downloaded successfully!", "success");
            printOutput("File saved as: Seth_Odero_Resume.pdf", "success");
        }, 2500);


                } catch (error) {
                    printOutput("Error downloading resume: " + error.message, "error");
                }
            }
        },

          
             
                clear: {
                    execute: () => {
                        output.innerHTML = '';
                    }
                }
            };
            
            // Create initial input line
            createInputLine();
            
            function createInputLine() {
                const inputLine = document.createElement('div');
                inputLine.className = 'input-line';
                
                const prompt = document.createElement('span');
                prompt.className = 'prompt';
                prompt.textContent = 'seth@portfolio:~$ ';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.autofocus = true;
                
                inputLine.appendChild(prompt);
                inputLine.appendChild(input);
                terminalBody.appendChild(inputLine);
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const command = input.value.trim();
                        if (command) {
                            // Add command to output
                            const commandLine = document.createElement('div');
                            commandLine.className = 'command-line';
                            commandLine.innerHTML = `<span class="prompt">seth@portfolio:~$</span> <span class="user-command">${command}</span>`;
                            output.appendChild(commandLine);
                            
                            // Process command
                            if (commands[command]) {
                                commands[command].execute();
                            } else {
                                printOutput(`Command not found: ${command}\nType 'help' for available commands, "error"`);
                            }
                            
                            // Remove input line
                            inputLine.remove();
                            
                            // Create new input line
                            createInputLine();
                            
                            // Scroll to bottom
                            terminalBody.scrollTop = terminalBody.scrollHeight;
                        }
                    }
                });
            }
            
            function printOutput(text, type = "") {
                const outputDiv = document.createElement('div');
                outputDiv.className = `command-output ${type}`;
                output.appendChild(outputDiv);

                let i = 0;
    const typingSpeed = 20; // milliseconds per character


    
    function typeWriter() {
        if (i < text.length) {
            // Add the next character
            outputDiv.textContent += text.charAt(i);
            i++;
            
            // Scroll to bottom
            terminalBody.scrollTop = terminalBody.scrollHeight;
            
            // Continue typing
            setTimeout(typeWriter, typingSpeed);
        }
    }
    
    // Start the typing effect
    typeWriter()
            }
;
    }

        );
    </script>
</body>
</html>
