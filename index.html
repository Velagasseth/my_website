<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth Odero | Terminal Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="window-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
                <div class="window-title">seth@portfolio: ~</div>
            </div>
            
            <div class="terminal-body">
                <div id="banner">
                    <pre class="ascii-art">
█__  __       _     _           
|  \/  | __ | |_ () __  ___  
| |\/| |/ ` | ' \| | '_ \/ __| 
| |  | | (| | |) | | | | \__ \ 
||  ||\,|./||| ||/ 

   Machine Learning Enthusiast
                    </pre>
                    <div class="welcome-message">
                        <p>Seth Odero - Junior Machine Learning Engineer</p>
                        <p>Type <span class="command">help</span> to see available commands</p>
                    </div>
                </div>

                <div id="output"></div>

                <div class="input-line">
                    <span class="prompt">seth@portfolio:<span class="path">~</span>$</span>
                    <input type="text" id="input" autofocus autocomplete="off" spellcheck="false" />
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
