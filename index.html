<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth Odero | ML Engineer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        .terminal-container {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        
        .terminal-window {
            background-color: #2b2b2b;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background-color: #3c3c3c;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
        }
        
        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .close {
            background-color: #ff5f56;
        }
        
        .minimize {
            background-color: #ffbd2e;
        }
        
        .maximize {
            background-color: #27c93f;
        }
        
        .window-title {
            margin-left: 15px;
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .terminal-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            height: calc(100% - 36px);
        }
        
        .prompt {
            color: #4CAF50;
        }
        
        .user-command {
            color: #e0e0e0;
        }
        
        .command-output {
            margin: 5px 0;
            line-height: 1.5;
            word-break: break-word;
        }
        
        .input-line {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .command-line {
            margin: 5px 0;
        }
        
        input {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: inherit;
            outline: none;
            flex: 1;
            margin-left: 5px;
        }
        
        .error {
            color: #ff5252;
        }
        
        .success {
            color: #4CAF50;
        }
        
        .terminal-link {
            color: #64b5f6;
            text-decoration: none;
        }
        
        .terminal-link:hover {
            text-decoration: underline;
        }
        
        #help {
            color: #64b5f6;
            cursor: pointer;
        }
        
        #help:hover {
            text-decoration: underline;
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3c3c3c;
            color: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .terminal-window {
                max-width: 800px;
                max-height: 600px;
                margin: auto;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                position: relative;
                top: 50%;
                transform: translateY(-50%);
            }
            
            .fullscreen-btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="window-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
                <div class="window-title">seth@portfolio: ~</div>
            </div>
            
            <div class="terminal-body" id="terminal-body">
                <div id="output"></div>
            </div>
        </div>
    </div>

    <button class="fullscreen-btn" id="fullscreen-btn">⛶</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const terminalBody = document.getElementById('terminal-body');
    const output = document.getElementById('output');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    let isTyping = false;
    let typingQueue = [];

    // Fullscreen functionality
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable fullscreen: ${err.message}`);
            });
            fullscreenBtn.textContent = '⛶';
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                fullscreenBtn.textContent = '⛶';
            }
        }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Detect fullscreen change to update button
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenBtn.textContent = '⛶';
        } else {
            fullscreenBtn.textContent = '⛶';
        }
    });

    // First welcome message
    startWelcomeSequence();

    function startWelcomeSequence() {
        typeText("cd ...", {class: "user-command", instant: true}, () => {
            typeText("Seth's ML terminal portfolio!\n\n", () => {
                typeText(`Type <strong id="help">'help'</strong> command to see available commands!\n`, () => {
                    createInputLine();
                });
            });
        });
    }

    const commands = {
        help: {
            execute: (args, callback) => {
                typeText("Available commands:\nabout - About me\nskills - My technical skills\nexperience - My experience\nprojects - My ML projects\ncontact - Contact information\nresume - Download my resume\nclear - Clear terminal", {}, callback);
            }
        },
        about: {
            execute: (args, callback) => {
                typeText("Hi!👋 I am Seth Odero - Junior Machine Learning Engineer\n\nPassionate data science student with a strong foundation in statistics, machine learning and data visualization seeking internship or entry level role where I can apply my analytic skills and contribute to solving complex problem using data.\nAm motivated and detail-oriented machine learning student at Kisii University with strong skills in Machine Learning, data manipulation and data visualization.\n\nSeeking an internship or entry-level position to apply my knowledge and skills in a practical environment", {}, callback);
            }
        },
        skills: {
            execute: (args, callback) => {
                typeText("Core Technologies:\n- Python, Flask\n- Seaborn, Matplotlib\n- Pandas, Numpy, Sckikit-learn, Pytorch\n- Streamlit, Jupyter Notebook\n\nDatabases:\n- MySQL, Sqlite, MicrosoftSQL\n\nOther:\n- CustomTkinter, Kivy", {}, callback);
            }
        },
        experience: {
            execute: (args, callback) => {
                typeText("Experience:\n\nKisii University (2023-Present)\n- Machine Learning Club, Kisii University\n- Organized workshops and hackathons on data science and machine learning.\n- Collaborated with peers on various machine learning projects.\n- Volunteer, Kisii County Community Center\n\nEducation:\n- Kisii University, Kisii County, Kenya Bachelor of Applied Science in Computer Science Expected Graduation: December 2027", {}, callback);
            }
        },
        projects: {
            execute: (args, callback) => {
                typeText("⚒ Data/Projects:\n\nDetailed case studies demonstrating my approach to real-world data challenges, showcasing techniques such as regression analysis, clustering, and deep learning using PyTorch\n\nUsing Scikit-learn datasets:\n> Breast_Cancer_Dataset\n> Iris_Datasets\n> Wine_Dataset\n\n👉 Project link: https://myportfolio-iojbai9uggilvkrwjjmvvz.streamlit.app/\n\nUsing Kaggle datasets:\nMade a model to predict estimated salary pay based on Age and Experience\n\n👉 Project link: https://sample2-pkjjtgzhdk7rgokdpek47e.streamlit.app/", {}, callback);
            }
        },
        contact: {
            execute: (args, callback) => {
                typeText("Contact Information:\n\n" +
                "📧 Email: <a href='mailto:velagasseth@gmail.com' class='terminal-link'>velagasseth@gmail.com</a>\n" +
                "📞 Phone: +254759812041\n" +
                "💻 GitHub: https://github.com/Velagasseth\n" +
                "🔗 LinkedIn: www.linkedin.com/in/velagasseth-tech\n\nAvailable for:\n- Speaking engagements\n- Entry-level roles\n", {}, callback);
            }
        },
        resume: {
            execute: (args, callback) => {
                typeText("Initiating resume download...", {class: "success"}, () => {
                    setTimeout(() => {
                        const link = document.createElement('a');
                        link.href = "Seth's_Resume  (5).pdf";
                        link.download = 'Seth_Odero_Resume.pdf';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        typeText("Resume downloaded successfully!", {class: "success"}, () => {
                            typeText("File saved as: Seth_Odero_Resume.pdf", {class: "success"}, callback);
                        });
                    }, 2500);
                });
            }
        },
        clear: {
            execute: (args, callback) => {
                output.innerHTML = '';
                if (callback) callback();
            }
        },
        fullscreen: {
            execute: (args, callback) => {
                toggleFullscreen();
                if (callback) callback();
            }
        }
    };

    function typeText(text, options = {}, callback) {
        if (typeof options === 'function') {
            callback = options;
            options = {};
        }

        const {class: className = '', delay = 20, instant = false, element} = options;
        const container = element || document.createElement('div');
        container.className = `command-output ${className}`;
        container.style.whiteSpace = 'pre-wrap';

        if (!element) {
            output.appendChild(container);
        }

        if (isTyping) {
            typingQueue.push({text, options, callback, container});
            return;
        }

        isTyping = true;

        if (instant) {
            container.innerHTML = text;
            terminalBody.scrollTop = terminalBody.scrollHeight;
            isTyping = false;
            if (callback) callback();
            processTypingQueue();
            return;
        }

        let i = 0;
        function typing() {
            if (i < text.length) {
                if (text[i] === '<') {
                    const tagEnd = text.indexOf('>', i) + 1;
                    container.innerHTML += text.substring(i, tagEnd);
                    i = tagEnd;
                } else {
                    container.innerHTML += text[i];
                    i++;
                }
                terminalBody.scrollTop = terminalBody.scrollHeight;
                setTimeout(typing, delay);
            } else {
                isTyping = false;
                if (callback) callback();
                processTypingQueue();
            }
        }
        typing();
    }

    function processTypingQueue() {
        if (typingQueue.length > 0 && !isTyping) {
            const next = typingQueue.shift();
            typeText(next.text, next.options, next.callback, next.container);
        }
    }

    function createInputLine() {
        const inputLine = document.createElement('div');
        inputLine.className = 'input-line';

        const prompt = document.createElement('span');
        prompt.className = 'prompt';
        prompt.textContent = 'seth@portfolio:~$ ';

        const input = document.createElement('input');
        input.type = 'text';
        input.autofocus = true;

        inputLine.appendChild(prompt);
        inputLine.appendChild(input);
        output.appendChild(inputLine);

        input.focus();
        terminalBody.scrollTop = terminalBody.scrollHeight;

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const command = input.value.trim();
                if (command) {
                    const userCommand = document.createElement('div');
                    userCommand.className = 'command-line';
                    userCommand.innerHTML = `<span class="prompt">seth@portfolio:~$ </span><span class="user-command">${command}</span>`;
                    output.appendChild(userCommand);

                    inputLine.remove();

                    const args = command.split(' ');
                    const cmd = args.shift().toLowerCase();

                    if (commands[cmd]) {
                        commands[cmd].execute(args, () => {
                            createInputLine();
                        });
                    } else {
                        typeText(`Command not found: ${command}. Type 'help' to see available commands!, {class: "error"}`, () => {
                            createInputLine();
                        });
                    }
                }
            }
        });
    }

    // Add click handler for help text
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'help') {
            const inputLine = document.querySelector('.input-line');
            if (inputLine) {
                const input = inputLine.querySelector('input');
                input.value = 'help';
                const event = new KeyboardEvent('keydown', {key: 'Enter'});
                input.dispatchEvent(event);
            }
        }
    });

    // Focus the terminal when clicking anywhere
    document.addEventListener('click', (e) => {
        if (e.target.id !== 'fullscreen-btn') {
            const input = document.querySelector('.input-line input');
            if (input) {
                input.focus();
            }
        }
    });
});
</script>

</body>
</html>
