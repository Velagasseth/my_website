<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth Odero | ML Engineer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg-color: #0f172a;
            --terminal-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #60a5fa;
            --prompt-color: #38bdf8;
            --error-color: #f87171;
            --success-color: #4ade80;
            --link-color: #7dd3fc;             /* Light blue for links */
    --link-hover-color: #38bdf8;       /* Bright blue on hover */
    --command-color: #4ade80;          /* Green for commands */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            line-height: 1.5;
            padding: 0; /* Remove padding */
            margin: 0; /* Remove margin */
            min-height: 100vh;
        }

        

.terminal-container {
    background-color: var(--terminal-bg);
    width: 100vw; /* Full viewport width */
    height: 100vh; /* Full viewport height */
    padding: 15px;
    display: flex;
    flex-direction: column;
}

#output {
    flex-grow: 1;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

        
        .terminal-window {
            background-color: var(--terminal-bg);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
        }
        
        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .close { background-color: #ef4444; }
        .minimize { background-color: #f59e0b; }
        .maximize { background-color: #10b981; }
        
        .window-title {
            flex-grow: 1;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .terminal-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .command-line {
            display: flex;
            margin-bottom: 5px;
        }
        
        .prompt {
            color: var(--prompt-color);
            margin-right: 8px;
            white-space: nowrap;
        }

        
        .user-command {
            color: var(--command-color);
        }
        
        .command-output {
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #help{
            color:#4ade80;
        }
        
        .success {
            color: var(--success-color);
        }
        
        .error {
            color: var(--error-color);
        }
        
        .input-line {
            display: flex;
            margin-top: auto; /* Stick to bottom */
        }

        .input-line input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
        }

        
        /* Scrollbar styling */
      
        /* Link styling - makes URLs clickable while maintaining terminal aesthetic */
.terminal-link {
    color: var(--link-color, #7dd3fc); /* Light blue color */
    text-decoration: underline;
    cursor: pointer;
    transition: all 0.2s ease;
}

.terminal-link:hover {
    color: var(--link-hover-color, #38bdf8); /* Brighter blue on hover */
    text-decoration: none;
}

/* Command highlighting - used for 'help' in welcome message */
.command {
    color: var(--command-color, #4ade80); /* Green color */
    font-weight: 500;
}

/* Add these to your existing :root variables */


/* Additional styling for command output */
.command-output a {
    /* Ensures all links in output use terminal styling */
    color: var(--link-color);
    text-decoration: underline;
}

.command-output a:hover {
    color: var(--link-hover-color);
    text-decoration: none;
}
 

    

/* Mobile responsive adjustments */

    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="window-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
                <div class="window-title">seth@portfolio: ~</div>
            </div>
            
            <div class="terminal-body" id="terminal-body">
                <div id="output">
                    <!-- Initial content -->
                
                </div>
                <!-- New input lines will be inserted here -->
            </div>
        </div>
    </div>

<script>

document.addEventListener('DOMContentLoaded', () => {
    const terminalBody = document.getElementById('terminal-body');
    const output = document.getElementById('output');
    let isTyping = false;
    let typingQueue = [];

    // Initial welcome message with typing effect
    typeText( {instant: true}, () => {
        typeText("cd ...", {class: "user-command", instant: true}, () => {
            typeText("Seth's ML terminal portfolio!\n\n", () => {
                typeText(`Type <strong id="help">'help'</strong> command to see available commands!`, () => {
                    typeText("", {class: "command"}, () => {
                        typeText("", () => {
                            createInputLine();
                        });
                    });
                });
            });
        });
    });

    // Command definitions
    const commands = {
                help: {
                    
                    execute: () => typeText("Available commands:\nabout - About me\nskills - My technical skills\nexperience - my experience\nprojects - My ML projects\ncontact - Contact information\nresume - Download my resume\nclear - Clear terminal")
                },
                about: {
                    
                execute: () => typeText("Hi!👋 I am Seth Odero - Junior Machine Learning Engineer\n\nPassionate data science student with a strong foundation in statistics, machine learning and data visualization seeking internship or entry level role where I can apply my analytic skills and contribute to solving complex problem using data.\nAm motivated and detail-oriented machine learning student at Kisii University with strong skills in Machine Learning, data manipulation and data visualization. \n\nSeeking an internship or entry-level position to apply my knowledge and skills in a practical environment")
                
            },
                skills: {
                    execute: () => typeText("Core Technologies:\n\n- Python, Flask\n- Seaborn, Matplotlib\n- Pandas, Numpy, Sckikit-learn, Pytorch\n- Streamlit, Jupyter Notebook\n\nDatabases:\n- MySQL, Sqlite, MicrosoftSQL\n\nOther:\n- CustomTkinter, Kivy")
                },

                experience: {
                    execute: () => typeText("Experience:\n\nKisii University (2023-Present)\n- Machine Learning Club, Kisii University\n- Organized workshops and hackathons on data science and machine learning.\n- Collaborated with peers on various machine learning projects.\n- Volunteer, Kisii County Community Center\n\nEducation:\n- Kisii University, Kisii County, Kenya Bachelor of Applied Science in Computer Science Expected Graduation: December 2027")
        
                },
                projects: {
                    execute: () => typeText("⚒️Data/Projects:\n\nDetailed case studies demonstrating my approach to real-world data challenges, showcasing techniques such as regression analysis, clustering, and deep learning using pytorch\n\nUsing Scikit-learn datasets ;\n> Breast_Cancer_Dataset\n>Iris_Datasets\n> Wine_Dataset\n\n👉Link to the project https://myportfolio-iojbai9uggilvkrwjjmvvz.streamlit.app/\n\nUsing Kaggle datasets ;\n\nMade a model from kaggle datasets , gives the estimated salary pay annualy based on Age and Experience\n\n👉Link to the project https://sample2-pkjjtgzhdk7rgokdpek47e.streamlit.app/\n")
                },
                contact: {
                    execute: () => typeText("Contact Information:\n\n"+
                    "📧Email: <a href='mailto:velagasseth@gmail.com' class='terminal-link'>velagasseth@gmail.com</a>\n" +
                    "📞Tel. :+254759812041\n"+
                    "💻 GitHub : https://github.com/Velagasseth\n"+
                    "🔗 Linkedin : www.linkedin.com/in/velagasseth-tech\n\nAvailable for:\n- Speaking engagements\n- Entry Level roles\n")
                },
        
        resume: {
            execute: () => {
                typeText("Initiating resume download...", "success");


                
                try {
                    setTimeout(() => {
            const link = document.createElement('a');
            link.href = "Seth's_Resume  (5).pdf";
            link.download = 'Seth_Odero_Resume.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            typeText("Resume downloaded successfully!", "success");
            typeText("File saved as: Seth_Odero_Resume.pdf", "success");
        }, 2500);


                } catch (error) {
                    typeText("Error downloading resume: " + error.message, "error");
                }
            }
        },

          
             
                clear: {
                    execute: () => {
                        output.innerHTML = '';
                    }
                }
            };
            
    // Core typing function
    function typeText(text, options = {}, callback) {
        if (typeof options === 'function') {
            callback = options;
            options = {};
        }
        
        const {class: className, delay = 20, instant = false, element} = options;
        const container = element || document.createElement('div');
        container.className = `command-output ${className || ''}`;
        container.style.whiteSpace = 'pre-wrap';
        
        if (!element) {
            output.appendChild(container);
        }

        if (isTyping) {
            typingQueue.push({text, options, callback, container});
            return;
        }
        
        isTyping = true;
        
        if (instant) {
            container.innerHTML = text;
            terminalBody.scrollTop = terminalBody.scrollHeight;
            isTyping = false;
            if (callback) callback();
            processTypingQueue();
            return;
        }

        let i = 0;
        const typing = () => {
            if (i < text.length) {
                // Handle HTML tags
                if (text[i] === '<') {
                    const tagEnd = text.indexOf('>', i) + 1;
                    container.innerHTML += text.substring(i, tagEnd);
                    i = tagEnd;
                } else {
                    container.innerHTML += text[i];
                    i++;
                }
                
                terminalBody.scrollTop = terminalBody.scrollHeight;
                setTimeout(typing, delay);
            } else {
                isTyping = false;
                if (callback) callback();
                processTypingQueue();
            }
        };
        
        typing();
    }

    function processTypingQueue() {
        if (typingQueue.length > 0 && !isTyping) {
            const next = typingQueue.shift();
            typeText(next.text, next.options, next.callback, next.container);
        }
    }

    function createInputLine() {
        const inputLine = document.createElement('div');
        inputLine.className = 'input-line';
        
        const prompt = document.createElement('span');
        prompt.className = 'prompt';
        prompt.textContent = 'seth@portfolio:~$ ';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.autofocus = true;
        
        inputLine.appendChild(prompt);
        inputLine.appendChild(input);
        terminalBody.appendChild(inputLine);
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const command = input.value.trim().toLowerCase();
                if (command) {
                    // Show entered command
                    const cmdLine = document.createElement('div');
                    cmdLine.className = 'command-line';
                    cmdLine.innerHTML = `<span class="prompt">seth@portfolio:~$</span> `;
                    
                    const cmdText = document.createElement('span');
                    cmdText.className = 'user-command';
                    cmdLine.appendChild(cmdText);
                    output.appendChild(cmdLine);
                    
                    // Type the command
                    typeText(command, {element: cmdText, delay: 10}, () => {
                        // Execute command after typing
                        const args = command.split(' ');
                        const cmd = args.shift();
                        
                        if (commands[cmd]) {
                            commands[cmd].execute(args);
                        } else {
                            typeText(`Command not found. Type 'help' for available commands!. error`);
                        }
                        
                        // Create new input line
                        inputLine.remove();
                        createInputLine();
                    });
                    
                    input.value = '';
                }
            }
        });
    }
});
</script>
</body>
</html>
